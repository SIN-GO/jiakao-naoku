name: Validate data and generated artifacts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python jiakao.py validate
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/learning.test.mjs
      - run: node --check web/app.mjs
      - run: python build_learning.py --source public
      - run: python jiakao.py build
      - run: python jiakao.py check-links generated/vault
      - run: git diff --exit-code -- generated
      - run: test -z "$(git ls-files --others --exclude-standard generated)"
      - run: python jiakao.py package
      - uses: actions/upload-artifact@v4
        with:
          name: jiakao-preview-${{ matrix.python-version }}
          path: dist/
